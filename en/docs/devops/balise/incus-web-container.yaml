# Output of `incus config show web` on flow.local, 2026-10-06, with machine-specific volatile.* and image.* keys removed.
# The container runs Debian 13 (trixie) with Caddy 2.11.6 from the Caddy stable apt repository (caddy-stable.list), on the default profile (incusbr0 NIC, default pool root disk).
architecture: x86_64
config: {}
devices:
  http:
    connect: tcp:127.0.0.1:80
    listen: tcp:0.0.0.0:80
    type: proxy
  https:
    connect: tcp:127.0.0.1:443
    listen: tcp:0.0.0.0:443
    type: proxy
ephemeral: false
profiles:
  - default
stateful: false
description: ""
